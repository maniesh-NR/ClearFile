name: Repository hygiene (secret scan + harness self-check)

# Repo hygiene, NOT sandbox backup. The no-cron owner directive (ADR-001 /
# harness/WORKFLOW.md §1) governs sandbox→GitHub backups, which stay
# strictly event-driven. A scheduled full-history secret scan is repository
# CI hygiene — explicitly sanctioned by ROADMAP Stage-1 item 6 — and the
# push trigger below is event-driven anyway.

on:
  push:
    branches: [main]
  schedule:
    # Mondays 04:33 UTC, de-synchronized from the top of the hour.
    - cron: '33 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene
  cancel-in-progress: false

jobs:
  gitleaks:
    name: gitleaks full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the whole history, not just HEAD
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  suites:
    # Stage-2 entry gate (2026-11-14, ADV-ENG ENG-4): push-CI coverage for
    # the suites themselves. Before this job, analyze/flutter-test/tsc ran
    # only inside release.yml (tag/dispatch), so a red suite could sit on
    # main until the next release. Same hardening posture as release.yml:
    # SHA-pinned actions, contents:read (workflow-wide), timeout, no secrets.
    name: Test suites (flutter analyze + test, tsc, cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: flutter pub get
        working-directory: clearfile
      - run: flutter analyze
        working-directory: clearfile
      - run: flutter test
        working-directory: clearfile
      - run: npm ci
      # Stage-2 entry gate (2026-11-17, ADV-SEC SEC-1): dependency-
      # vulnerability gate at CRITICAL level over the production tree
      # (the web-standalone tarball is a self-hostable release asset).
      # Fail-closed: a new critical advisory in the shipped dependency
      # tree reds this job on every push/weekly run. Dev-level
      # moderate/high advisories stay visible via `npm audit` without
      # gating CI (the scaffold-heavy dev list is trimmable later).
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx tsc --noEmit
      # Stage-3 fixtures-first (2026-11-14): the independent golden-fixture
      # oracle (Decimal arithmetic written from the IRS form text, not from
      # either engine) runs in CI so the fixtures stay form-true.
      - run: python3 scripts/verify_golden_fixtures.py
      # Stage-3 web parity (ADR-009, 2026-11-15): the TypeScript engine runs
      # the SAME shared golden fixtures the Flutter suite runs (compiles the
      # engine to .parity-build via scripts/tsconfig.parity.json, then asserts
      # every expected field within tolerance).
      - run: node scripts/web_parity_test.mjs
      # Stage-3 bridges (2026-11-15): the TXF exporter verification suite +
      # .tax container-analysis tests (compiles src/lib/files to .files-build
      # via scripts/tsconfig.files.json, CommonJS emit, then asserts the
      # exporter against the published TXF spec v042 structure and the
      # .tax analyzer against synthetic containers).
      - run: node scripts/txf_taxfile_test.mjs
      # Stage-5 AI hardening (2026-11-24): the AI cascade replays synthetic
      # provider fixtures (fixtures/ai/, provenance in fixtures/ai/README.md)
      # through the compiled ladder via a STUBBED fetch — no live network, no
      # keys — asserting the errorKind cascade sequence, transport header
      # discipline (x-goog-api-key / Authorization Bearer, key never in the
      # URL) and the ≤200-char snippet rule on Attempt.error.
      - run: node scripts/ai_cascade_fixture_test.mjs
      # Stage-5 prompt-injection suite (same compile): pins the generic
      # ERROR_KIND_LABEL display map (ai-ui.tsx / settings.tsx), the
      # parseExtracted/parseReview field whitelists, and extractJson's
      # object-only refusal against hostile provider payloads.
      - run: node scripts/ai_injection_test.mjs

      # D29 (2026-11-26 gate condition): the release.yml tag guard is
      # extracted VERBATIM and exercised in all six scenarios (incl. the
      # annotated-tag push shape and the fail-closed fetch-error path) so
      # guard drift is CI-caught. Read-only fetches against origin.
      - run: bash scripts/test_tag_guard.sh
      # N1 entry gate (2026-11-26, LEGAL-2/SEC-3): the licensing annex's
      # license check DISCHARGED at core-landing in zero-dependency form —
      # fail-closed assertion that Cargo.lock contains exactly the root
      # package AND core/Cargo.toml declares no dependency sections.
      # Upgraded to a real cargo-deny in the same commit as the first
      # external dependency (the recorded annex-trigger rule).
      - name: license check (zero-dependency assertion)
        run: |
          LOCK_PKGS="$(grep -c '^\[\[package\]\]' core/Cargo.lock)"
          if [ "$LOCK_PKGS" -ne 1 ]; then
            echo "license check: FAIL — Cargo.lock has $LOCK_PKGS packages; the recorded zero-dependency posture expects exactly 1 (the root). A first dependency requires the cargo-deny upgrade in the same commit." >&2
            exit 1
          fi
          if grep -qE '^\[(dependencies|dev-dependencies|build-dependencies)\]' core/Cargo.toml; then
            echo "license check: FAIL — core/Cargo.toml declares a dependency section; the cargo-deny upgrade must land in the same commit." >&2
            exit 1
          fi
          echo "license check: ok — zero dependencies (1 package: clearfile-core)"
      # N1 session 1 (2026-11-26, SEC-4/ENG-8): the Rust core's suite —
      # the third golden-fixture runner over the SHARED fixtures/tax
      # corpus (17 fixtures; deferred ones #[ignore]d with recorded
      # reasons, never red on main) + the comparator/strict-reader unit
      # tests. Runner-image rustup only (no toolchain actions, no new
      # uses: lines, no secrets); --locked so the zero-dep lockfile is
      # authoritative.
      - name: rust core (cargo test --locked)
        run: |
          rustc --version
          cargo --version
          cargo test --locked
        working-directory: core

  linux-app:
    # N2 session 2 (2026-11-26, the ADR-017 epilogue — the Linux native
    # app's lane; gate conditions ENG-2/ENG-5/ENG-6/SEC-2/LEGAL-5): the
    # rustc MSRV guard runs fail-closed FIRST (parse `rustc --version`,
    # assert >= 1.95 — slint 1.19.1's declared MSRV), then the app's unit
    # tests, the headless smoke (the FULL stdout diffed byte-for-byte
    # against the committed expected text — the same ONE pipeline fn the
    # window consumes), the window smoke (apt libxkbcommon-x11; DIRECT
    # `Xvfb :99 &` — xvfb-run needs xauth, which the runner image lacks;
    # the software renderer, GL-free; inside `timeout` with failure
    # asserted; no leftover Xvfb), and cargo-deny over the first external
    # dependency (the recorded two-mechanism choice: the SHA-pinned
    # EmbarkStudios action — same trust class as the SHA-pinned gitleaks
    # action). Every cargo invocation is --locked with the committed
    # apps/linux/Cargo.lock; same posture as the other jobs: SHA-pinned
    # actions, contents: read, timeout, no secrets.
    name: Linux app (cargo test + headless/window smokes + cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The MSRV guard must be the FIRST gate (ENG-2): refuse to build with
      # a rustc older than slint 1.19.1's declared MSRV rather than fail
      # with cryptic compile errors — or worse, pass on a newer runner.
      - name: rustc guard (>= 1.95, slint 1.19.1's MSRV)
        run: |
          LINE="$(rustc --version)"
          VERSION="${LINE#rustc }"
          MAJOR="$(printf '%s' "$VERSION" | cut -d. -f1)"
          MINOR="$(printf '%s' "$VERSION" | cut -d. -f2)"
          case "$MAJOR" in
            ''|*[!0-9]*)
              echo "rustc guard: FAIL — could not parse a major version from: $LINE" >&2
              exit 1 ;;
          esac
          case "$MINOR" in
            ''|*[!0-9]*)
              echo "rustc guard: FAIL — could not parse a minor version from: $LINE" >&2
              exit 1 ;;
          esac
          if [ "$MAJOR" -lt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -lt 95 ]; }; then
            echo "rustc guard: FAIL — rustc $MAJOR.$MINOR is older than slint 1.19.1's declared MSRV (1.95); refusing to build. rustc --version: $LINE" >&2
            exit 1
          fi
          echo "rustc guard: ok — $MAJOR.$MINOR >= 1.95 ($LINE)"
      - name: system deps (the build-time font stack + the smoke's X11 lib)
        run: |
          sudo apt-get update -y
          # The exit-gate PROD finding (hygiene runs #38/#39 RED at the
          # unit-test step): yeslogic-fontconfig-sys needs fontconfig AT
          # BUILD TIME (pkg-config fontconfig), so the deps install BEFORE
          # the first cargo invocation, not in the window-smoke step.
          # freetype beside it as insurance; libxkbcommon-x11 for the
          # later window smoke (winit's X11 path dlopens it at runtime).
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-x11-0
      - name: app unit tests
        run: cargo test --locked --manifest-path apps/linux/Cargo.toml
      # The headless smoke (ENG-6): the shared pipeline's text output,
      # diffed in full against the committed expected text — any drift in
      # the summary the window also shows reds CI.
      - name: headless smoke (diff against the committed expected text)
        run: |
          cargo run --locked --manifest-path apps/linux/Cargo.toml -- --headless fixtures/migration/v1-web-envelope.json > /tmp/headless.out
          diff -u apps/linux/tests/expected-headless.txt /tmp/headless.out
      # The window smoke (ENG-5): the real window, one bounded event loop,
      # the window-smoke-ok marker. libxkbcommon-x11 is what winit's X11
      # backend loads; the software renderer needs no GL (the femtovg
      # stack is compiled but not picked: SLINT_BACKEND=winit-software).
      - name: window smoke (Xvfb + the software renderer)
        run: |
          # The system deps (the font stack + libxkbcommon-x11) installed
          # in the job's setup step above.
          Xvfb :99 &
          XVFB_PID=$!
          # The 2026-11-27 flake (run 45943612134: exit 101, the same code
          # green on the three prior runs): the app connected before Xvfb
          # was listening — a bounded wait for the display socket first.
          for i in $(seq 1 50); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.1
          done
          [ -S /tmp/.X11-unix/X99 ] || {
            echo "window smoke: FAIL — Xvfb's display socket never appeared" >&2
            exit 1
          }
          SLINT_BACKEND=winit-software DISPLAY=:99 timeout 60 cargo run --locked --manifest-path apps/linux/Cargo.toml -- --smoke > /tmp/window-smoke.out 2>&1 || (echo "window smoke: FAIL (exit $?)" && cat /tmp/window-smoke.out && kill "$XVFB_PID" 2>/dev/null || true && exit 1)
          kill "$XVFB_PID" 2>/dev/null || true
          grep -q "window-smoke-ok" /tmp/window-smoke.out || (echo "window smoke: the window-smoke-ok marker is missing" && cat /tmp/window-smoke.out && exit 1)
          cat /tmp/window-smoke.out
          echo "window smoke: ok"
      # cargo-deny (SEC-2/LEGAL-5, the recorded two-mechanism choice (a)):
      # the EmbarkStudios action, SHA-pinned per the D10 posture, running
      # the committed apps/linux/deny.toml against the full lockfile (the
      # target-gated packages included). Resolved: tag v2.1.4 ->
      # commit 81891abc19297b21343b15ef67dc61e4aea74fda (its image runs
      # cargo-deny 0.22.1).
      - name: cargo-deny (licenses + sources + advisories, apps/linux)
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          arguments: ''
          command: check
          command-arguments: --hide-inclusion-graph
          manifest-path: apps/linux/Cargo.toml

  android-app:
    # N3 session 2 (2026-11-27, the N3 gate's ledger items 3/9/10): the
    # Android lane — CI-primary BY MEASUREMENT (the sandbox has no
    # Android SDK/NDK and JRE-only Java; the app session's every compile
    # is this lane's). Guards first, fail-closed on every toolchain
    # identity (never the runner defaults — they drift); every cargo
    # invocation --locked; the committed-header freshness check; the
    # boundary battery; the host cdylib (host-jni) + the android cdylib
    # (the pinned cross-target, the NDK clang as linker); assembleDebug
    # (the installable-APK proof: the .so packaged into lib/arm64-v8a);
    # the JVM unit tests loading the HOST-built cdylib and calling the
    # REAL Java_* mangled symbols through the same JNI seam the device
    # uses (the no-emulator lane); cargo-deny over core-ffi's lock; NO
    # uploads (nothing ships — the v2.0.0 discipline).
    name: "Android app (JNI seam: cross-build + assembleDebug + JVM tests + cargo-deny)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      # The pinned identities, asserted fail-closed below (never the env
      # defaults): the SDK root the image documents, NDK 29.0.14206865
      # (present per the 2026-11-27 image readme, asserted by path), JDK
      # 21 (the image default is 25). Gradle: the 9.9 SERIES guard (the
      # step below) — the exact-pin caught the fleet's mid-rollout state
      # (9.9.1 and 9.9.2 both live on 2026-11-27, two consecutive runs
      # measuring different patch versions); the series form stays
      # fail-closed on any drift outside 9.9 while tolerating the rolling
      # patch updates.
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: "29.0.14206865"
      JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The rustc guard first (the linux-app job's pattern): refuse a
      # rustc older than the repo's toolchain family (the pinned
      # 1.100.0's era; >= 1.95) rather than fail cryptically later. The
      # rustup target add is the runner-side affordance this sandbox's
      # standalone toolchain lacks (measured at the gate).
      - name: rustc guard + the android rust target
        run: |
          LINE="$(rustc --version)"
          VERSION="${LINE#rustc }"
          MAJOR="$(printf '%s' "$VERSION" | cut -d. -f1)"
          MINOR="$(printf '%s' "$VERSION" | cut -d. -f2)"
          case "$MAJOR" in ''|*[!0-9]*) echo "rustc guard: FAIL — unparsable: $LINE" >&2; exit 1 ;; esac
          case "$MINOR" in ''|*[!0-9]*) echo "rustc guard: FAIL — unparsable: $LINE" >&2; exit 1 ;; esac
          if [ "$MAJOR" -lt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -lt 95 ]; }; then
            echo "rustc guard: FAIL — rustc $MAJOR.$MINOR < 1.95; refusing. $LINE" >&2
            exit 1
          fi
          echo "rustc guard: ok — $MAJOR.$MINOR >= 1.95 ($LINE)"
          rustup target add aarch64-linux-android
      - name: NDK identity guard (the pinned 29.0.14206865, never the default)
        run: |
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION" || {
            echo "android guard: FAIL — the pinned NDK $NDK_VERSION is absent under $ANDROID_HOME/ndk (the runner image drifted):" >&2
            ls "$ANDROID_HOME/ndk" >&2 || true
            exit 1
          }
          echo "android guard: NDK $NDK_VERSION present"
      - name: JDK guard (JAVA_HOME pinned to 21, never the image default 25)
        run: |
          test -x "$JAVA_HOME/bin/java" || {
            echo "android guard: FAIL — JDK 21 missing at $JAVA_HOME (the image layout drifted):" >&2
            ls /usr/lib/jvm >&2 || true
            exit 1
          }
          "$JAVA_HOME/bin/java" -version
      - name: Gradle version guard (the 9.9 series, fail-closed on any other)
        run: |
          G="$(gradle --version | sed -n 's/^Gradle *//p' | head -n1)"
          case "$G" in
            9.9.*) echo "android guard: Gradle $G (the verified 9.9 series)" ;;
            *)
              echo "android guard: FAIL — the runner's Gradle is '$G', outside the verified 9.9 series (drift)" >&2
              exit 1 ;;
          esac
      - name: header freshness (the committed clearfile.h == the regeneration)
        run: |
          cargo build --locked --manifest-path core-ffi/Cargo.toml
          git diff --exit-code -- core-ffi/clearfile.h
      - name: core-ffi boundary battery (host tests — the fixtures + the corpus through the C boundary)
        run: cargo test --locked --manifest-path core-ffi/Cargo.toml --features panic-hook-test
      - name: the host cdylib (host-jni — the JVM test lane's library)
        run: cargo build --locked --manifest-path core-ffi/Cargo.toml --features host-jni
      - name: the android cdylib (the pinned cross-target, the NDK clang as the linker)
        run: cargo build --locked --manifest-path core-ffi/Cargo.toml --target aarch64-linux-android
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /usr/local/lib/android/sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
      # assembleDebug (PROD-3: beyond compileDebugKotlin — the installable
      # APK with the cross-built .so packaged into lib/arm64-v8a) + the
      # JVM unit tests through the REAL Java_* seam (the golden-fixture
      # parity + the error surfacing). No gradle wrapper (the blob policy
      # bars the wrapper jar): the version-guarded preinstalled Gradle.
      - name: assembleDebug + the JVM unit tests through the real JNI seam
        run: |
          mkdir -p apps/android/app/build/generated/clearfile/jniLibs/arm64-v8a
          cp core-ffi/target/aarch64-linux-android/debug/libclearfile_core_ffi.so \
             apps/android/app/build/generated/clearfile/jniLibs/arm64-v8a/
          cd apps/android
          gradle --no-daemon \
            -Dclearfile.host.lib="$GITHUB_WORKSPACE/core-ffi/target/debug/libclearfile_core_ffi.so" \
            :app:assembleDebug :app:testDebugUnitTest
          # The installable-APK proof: the debug APK exists and carries
          # the .so (the packaging the compile-only lane would leave
          # unproven).
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "assembleDebug: FAIL — no debug APK at $APK" >&2; exit 1; }
          unzip -l "$APK" | grep 'lib/arm64-v8a/libclearfile_core_ffi.so' || {
            echo "assembleDebug: FAIL — the .so is not packaged in the APK" >&2
            exit 1
          }
          echo "assembleDebug: ok — the APK carries the cross-built .so"
      # The SEC rider's supersession discharge (the N4 gate accepted the
      # shape): the fail-closed gradle dependency assertions — the
      # RUNTIME classpath resolves ZERO external artifacts (the security
      # property a lockfile would give, asserted directly) and the TEST
      # classpath exactly junit 4.13.2 + hamcrest-core 1.3.
      - name: gradle dependency assertions (the rider's supersession discharge)
        run: |
          cd apps/android
          RUNTIME="$(gradle --no-daemon -q :app:dependencies --configuration debugRuntimeClasspath)"
          # The ONE recorded runtime external artifact: the kotlin-stdlib
          # (Apache-2.0, via :shared's KMP build — the first live run's
          # finding: it rides the APK's runtime classpath) — pinned exactly;
          # anything else external fails.
          echo "$RUNTIME" | grep -E '^[[:space:]]*[+\\]--- ' | grep -v ':shared' | grep -v 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21' > /tmp/ext-deps.txt || true
          if [ -s /tmp/ext-deps.txt ]; then
            echo "dependency assertion: FAIL — external runtime artifacts:" >&2
            cat /tmp/ext-deps.txt >&2
            exit 1
          fi
          TESTCP="$(gradle --no-daemon -q :app:dependencies --configuration debugUnitTestRuntimeClasspath)"
          echo "$TESTCP" | grep -q 'junit:junit:4.13.2' || { echo "dependency assertion: FAIL — junit 4.13.2 missing from the test classpath" >&2; exit 1; }
          echo "$TESTCP" | grep -E '^[[:space:]]*[+\\]--- ' | grep -v "project ':app'" | grep -v "project ':shared'" | grep -v 'junit:junit:4.13.2' | grep -v 'org.hamcrest:hamcrest-core:1.3' | grep -v 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21' > /tmp/ext-test-deps.txt || true
          if [ -s /tmp/ext-test-deps.txt ]; then
            echo "dependency assertion: FAIL — unexpected external test artifacts:" >&2
            cat /tmp/ext-test-deps.txt >&2
            exit 1
          fi
          echo "dependency assertions: ok — the runtime classpath is exactly :shared + the kotlin-stdlib 2.4.21 (the one recorded runtime artifact); the test classpath adds exactly junit 4.13.2 + hamcrest-core 1.3"
      # cargo-deny over core-ffi's lock (the crate with the cbindgen + jni
      # trees; the closed allow-list incl. the recorded MPL-2.0 join).
      - name: cargo-deny (licenses + sources + advisories, core-ffi)
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          arguments: ''
          command: check
          command-arguments: --hide-inclusion-graph
          manifest-path: core-ffi/Cargo.toml

  windows-app:
    # N4 session 2 (2026-11-27, the N4 gate's ledger): the Windows lane —
    # the FIRST C++ consumption of the committed flat-C header, verified
    # NATIVELY (the mingw lane rejected at the gate: a second ABI surface
    # with no consumer). Fail-closed guards first (the rustc + host-triple
    # assertion enforces the msvc lane mechanically); cargo --locked
    # everywhere; the boundary battery RUNS ON WINDOWS (the real ABI
    # lane); the MSVC compile/link (the vcvars discovery — cl is off-PATH
    # on the runner); the .dll beside the exe before the smoke; the
    # headless smoke diffs the full stdout against the LINUX app's
    # committed expected text (one canonical text family, two platforms);
    # the PE import-table network guard (Windows has no manifest
    # permissions — the no-network claim's mechanical proof); NO uploads
    # (nothing ships).
    name: "Windows app (C++ seam: guards + boundary battery + MSVC build + headless smoke + import guard)"
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The rustc guard + the host-triple assertion (the mingw rejection
      # enforced mechanically: the lane builds ONLY for windows-msvc).
      - name: rustc + host-triple guard (msvc, fail-closed)
        shell: bash
        run: |
          LINE="$(rustc --version)"
          VERSION="${LINE#rustc }"
          MAJOR="$(printf '%s' "$VERSION" | cut -d. -f1)"
          MINOR="$(printf '%s' "$VERSION" | cut -d. -f2)"
          case "$MAJOR" in ''|*[!0-9]*) echo "rustc guard: FAIL — unparsable: $LINE" >&2; exit 1 ;; esac
          case "$MINOR" in ''|*[!0-9]*) echo "rustc guard: FAIL — unparsable: $LINE" >&2; exit 1 ;; esac
          if [ "$MAJOR" -lt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -lt 95 ]; }; then
            echo "rustc guard: FAIL — rustc $MAJOR.$MINOR < 1.95; refusing. $LINE" >&2
            exit 1
          fi
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$HOST" != "x86_64-pc-windows-msvc" ]; then
            echo "host-triple guard: FAIL — host '$HOST' is not x86_64-pc-windows-msvc (the msvc lane is the recorded N4 shape)" >&2
            exit 1
          fi
          echo "guards: ok — rustc $MAJOR.$MINOR >= 1.95, host $HOST"
      - name: the FFI cdylib (release) — the .dll + the import library
        shell: bash
        run: |
          cargo build --locked --release --manifest-path core-ffi/Cargo.toml
          test -f core-ffi/target/release/clearfile_core_ffi.dll || { echo "FAIL — the .dll was not emitted" >&2; exit 1; }
          test -f core-ffi/target/release/clearfile_core_ffi.dll.lib || { echo "FAIL — the MSVC import library was not emitted" >&2; exit 1; }
      - name: the boundary battery ON WINDOWS (the real ABI lane)
        shell: bash
        run: cargo test --locked --manifest-path core-ffi/Cargo.toml --features panic-hook-test
      # The C++ compile + link + the PE import-table network guard, in ONE
      # cmd step (the vcvars discovery: cl is off-PATH on the runner —
      # vswhere finds the VS instance, vcvars64 puts cl on PATH).
      - name: the MSVC build + the import-table network guard
        shell: cmd
        run: |
          for /f "tokens=* usebackq" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir apps\windows\build 2>NUL
          cl /utf-8 /std:c++17 /W4 /EHsc apps\windows\main.cpp /Fe:apps\windows\build\clearfile-windows.exe /I core-ffi /link /LIBPATH:core-ffi\target\release core-ffi\target\release\clearfile_core_ffi.dll.lib user32.lib gdi32.lib comdlg32.lib d2d1.lib dwrite.lib
          if errorlevel 1 exit /b 1
          echo The network-import guard (the no-network claim's mechanical proof):
          dumpbin /DEPENDENTS apps\windows\build\clearfile-windows.exe | findstr /i "ws2_32 wininet winhttp urlmon" && exit /b 1
          dumpbin /DEPENDENTS core-ffi\target\release\clearfile_core_ffi.dll | findstr /i "ws2_32 wininet winhttp urlmon" && exit /b 1
          echo import guard: ok — no network imports in the exe or the dll
          rem findstr's no-match (the good case) leaves errorlevel 1 and
          rem echo does not reset it — the explicit success exit is load-bearing.
          exit /b 0
      # The headless smoke (the Linux app's canonical expected text — one
      # text family, two platforms): the .dll rides beside the exe.
      - name: the headless smoke (diff against the Linux app's expected text)
        shell: bash
        run: |
          cp core-ffi/target/release/clearfile_core_ffi.dll apps/windows/build/
          ./apps/windows/build/clearfile-windows.exe --headless fixtures/migration/v1-web-envelope.json > /tmp/headless.out
          # The EOL normalization (the round-4 finding: every line differed
          # with identical content — the MSVC CRT's stdout text-mode CRLF
          # translation on the runner despite the exe's _O_BINARY setmode).
          # The CONTENT parity stays byte-exact after the normalization;
          # the canonical text family is the assertion.
          tr -d '\r' < /tmp/headless.out > /tmp/headless.lf
          diff -u apps/linux/tests/expected-headless.txt /tmp/headless.lf
          echo "headless smoke: ok — the byte-parity text family across platforms (EOL-normalized)"

  re-tooling:
    # Stage-2 execution session 1 (2026-11-22, ADR-012 mechanics (b)/(e) +
    # the LEGAL-1 lint + the tools' security contract): the no-binary-blob
    # assertion (tracked binaries are legal only on the enumerated
    # own-asset allow-list — 28 entries; any new binary under fixtures/,
    # tools/, docs/, src/, scripts/, or harness/ fails here), the RE
    # Phase 1-3 tools' synthetic-fixture unit suite (write-free, caps with
    # refusal tests, crash battery, §7.1 provenance-manifest refusal —
    # fixtures generated at runtime under the gitignored fixtures/re/
    # path), and the docs/formats provenance lint. Same repo posture:
    # SHA-pinned actions, contents: read, timeout, no secrets; and this
    # tooling is never wired into release.yml artifact paths (ADR-012 (e)).
    name: RE tooling (blob assertion + tool tests + formats lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/check_binary_blobs.py
      - run: python3 scripts/test_re_tools.py
      - run: python3 scripts/lint_format_specs.py

  harness-check:
    name: Harness memory self-check (D19)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/harness_check.sh
