name: Repository hygiene (secret scan + harness self-check)

# Repo hygiene, NOT sandbox backup. The no-cron owner directive (ADR-001 /
# harness/WORKFLOW.md §1) governs sandbox→GitHub backups, which stay
# strictly event-driven. A scheduled full-history secret scan is repository
# CI hygiene — explicitly sanctioned by ROADMAP Stage-1 item 6 — and the
# push trigger below is event-driven anyway.

on:
  push:
    branches: [main]
  schedule:
    # Mondays 04:33 UTC, de-synchronized from the top of the hour.
    - cron: '33 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene
  cancel-in-progress: false

jobs:
  gitleaks:
    name: gitleaks full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the whole history, not just HEAD
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  suites:
    # Stage-2 entry gate (2026-11-14, ADV-ENG ENG-4): push-CI coverage for
    # the suites themselves. Before this job, analyze/flutter-test/tsc ran
    # only inside release.yml (tag/dispatch), so a red suite could sit on
    # main until the next release. Same hardening posture as release.yml:
    # SHA-pinned actions, contents:read (workflow-wide), timeout, no secrets.
    name: Test suites (flutter analyze + test, tsc, cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: flutter pub get
        working-directory: clearfile
      - run: flutter analyze
        working-directory: clearfile
      - run: flutter test
        working-directory: clearfile
      - run: npm ci
      # Stage-2 entry gate (2026-11-17, ADV-SEC SEC-1): dependency-
      # vulnerability gate at CRITICAL level over the production tree
      # (the web-standalone tarball is a self-hostable release asset).
      # Fail-closed: a new critical advisory in the shipped dependency
      # tree reds this job on every push/weekly run. Dev-level
      # moderate/high advisories stay visible via `npm audit` without
      # gating CI (the scaffold-heavy dev list is trimmable later).
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx tsc --noEmit
      # Stage-3 fixtures-first (2026-11-14): the independent golden-fixture
      # oracle (Decimal arithmetic written from the IRS form text, not from
      # either engine) runs in CI so the fixtures stay form-true.
      - run: python3 scripts/verify_golden_fixtures.py
      # Stage-3 web parity (ADR-009, 2026-11-15): the TypeScript engine runs
      # the SAME shared golden fixtures the Flutter suite runs (compiles the
      # engine to .parity-build via scripts/tsconfig.parity.json, then asserts
      # every expected field within tolerance).
      - run: node scripts/web_parity_test.mjs
      # Stage-3 bridges (2026-11-15): the TXF exporter verification suite +
      # .tax container-analysis tests (compiles src/lib/files to .files-build
      # via scripts/tsconfig.files.json, CommonJS emit, then asserts the
      # exporter against the published TXF spec v042 structure and the
      # .tax analyzer against synthetic containers).
      - run: node scripts/txf_taxfile_test.mjs
      # Stage-5 AI hardening (2026-11-24): the AI cascade replays synthetic
      # provider fixtures (fixtures/ai/, provenance in fixtures/ai/README.md)
      # through the compiled ladder via a STUBBED fetch — no live network, no
      # keys — asserting the errorKind cascade sequence, transport header
      # discipline (x-goog-api-key / Authorization Bearer, key never in the
      # URL) and the ≤200-char snippet rule on Attempt.error.
      - run: node scripts/ai_cascade_fixture_test.mjs
      # Stage-5 prompt-injection suite (same compile): pins the generic
      # ERROR_KIND_LABEL display map (ai-ui.tsx / settings.tsx), the
      # parseExtracted/parseReview field whitelists, and extractJson's
      # object-only refusal against hostile provider payloads.
      - run: node scripts/ai_injection_test.mjs

      # D29 (2026-11-26 gate condition): the release.yml tag guard is
      # extracted VERBATIM and exercised in all six scenarios (incl. the
      # annotated-tag push shape and the fail-closed fetch-error path) so
      # guard drift is CI-caught. Read-only fetches against origin.
      - run: bash scripts/test_tag_guard.sh
      # N1 entry gate (2026-11-26, LEGAL-2/SEC-3): the licensing annex's
      # license check DISCHARGED at core-landing in zero-dependency form —
      # fail-closed assertion that Cargo.lock contains exactly the root
      # package AND core/Cargo.toml declares no dependency sections.
      # Upgraded to a real cargo-deny in the same commit as the first
      # external dependency (the recorded annex-trigger rule).
      - name: license check (zero-dependency assertion)
        run: |
          LOCK_PKGS="$(grep -c '^\[\[package\]\]' core/Cargo.lock)"
          if [ "$LOCK_PKGS" -ne 1 ]; then
            echo "license check: FAIL — Cargo.lock has $LOCK_PKGS packages; the recorded zero-dependency posture expects exactly 1 (the root). A first dependency requires the cargo-deny upgrade in the same commit." >&2
            exit 1
          fi
          if grep -qE '^\[(dependencies|dev-dependencies|build-dependencies)\]' core/Cargo.toml; then
            echo "license check: FAIL — core/Cargo.toml declares a dependency section; the cargo-deny upgrade must land in the same commit." >&2
            exit 1
          fi
          echo "license check: ok — zero dependencies (1 package: clearfile-core)"
      # N1 session 1 (2026-11-26, SEC-4/ENG-8): the Rust core's suite —
      # the third golden-fixture runner over the SHARED fixtures/tax
      # corpus (17 fixtures; deferred ones #[ignore]d with recorded
      # reasons, never red on main) + the comparator/strict-reader unit
      # tests. Runner-image rustup only (no toolchain actions, no new
      # uses: lines, no secrets); --locked so the zero-dep lockfile is
      # authoritative.
      - name: rust core (cargo test --locked)
        run: |
          rustc --version
          cargo --version
          cargo test --locked
        working-directory: core

  re-tooling:
    # Stage-2 execution session 1 (2026-11-22, ADR-012 mechanics (b)/(e) +
    # the LEGAL-1 lint + the tools' security contract): the no-binary-blob
    # assertion (tracked binaries are legal only on the enumerated
    # own-asset allow-list — 28 entries; any new binary under fixtures/,
    # tools/, docs/, src/, scripts/, or harness/ fails here), the RE
    # Phase 1-3 tools' synthetic-fixture unit suite (write-free, caps with
    # refusal tests, crash battery, §7.1 provenance-manifest refusal —
    # fixtures generated at runtime under the gitignored fixtures/re/
    # path), and the docs/formats provenance lint. Same repo posture:
    # SHA-pinned actions, contents: read, timeout, no secrets; and this
    # tooling is never wired into release.yml artifact paths (ADR-012 (e)).
    name: RE tooling (blob assertion + tool tests + formats lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/check_binary_blobs.py
      - run: python3 scripts/test_re_tools.py
      - run: python3 scripts/lint_format_specs.py

  harness-check:
    name: Harness memory self-check (D19)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/harness_check.sh
