            exit 1
          fi
          rm -f "$fetch_err"
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # --------------------------------------------------------------------------
      # D46 rework (2026-11-28, the owner-ordered discharge of the N6-exit
      # constraint): the nextjs-web job builds the wasm boot asset itself —
      # LEGAL's pre-ruled narrow form (the wasm steps land in THIS job ONLY,
      # built --locked from the tagged checkout). Before this rework the job
      # was STALE-BY-DESIGN: `npm run build` is green without the .wasm
      # (LEGAL's live probe), so a tag shipped a GREEN-built tar.gz whose app
      # cannot boot — GREEN-THROUGH-BROKEN. The harness_check variant guard
      # flipped to the references-confined-to-nextjs-web state in the SAME
      # commit. The runner's preinstalled rustup/rustc only — no new action
      # pins (the hygiene suites job's pattern); the rustc guard is
      # fail-closed before any wasm build.
      # --------------------------------------------------------------------------
      - name: The wasm32 core build (the D46 boot asset, --locked from the tagged checkout)
        run: |
          LINE="$(rustc --version)"
          VERSION="${LINE#rustc }"
          MAJOR="$(printf '%s' "$VERSION" | cut -d. -f1)"
          MINOR="$(printf '%s' "$VERSION" | cut -d. -f2)"
          case "$MAJOR" in ''|*[!0-9]*) echo "rustc guard: FAIL — unparsable: $LINE" >&2; exit 1 ;; esac
          case "$MINOR" in ''|*[!0-9]*) echo "rustc guard: FAIL — unparsable: $LINE" >&2; exit 1 ;; esac
          if [ "$MAJOR" -lt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -lt 95 ]; }; then
            echo "rustc guard: FAIL — rustc $MAJOR.$MINOR < 1.95; refusing. $LINE" >&2
            exit 1
          fi
          echo "rustc guard: ok — $MAJOR.$MINOR >= 1.95 ($LINE)"
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path core-ffi/Cargo.toml
          cp core-ffi/target/wasm32-unknown-unknown/release/clearfile_core_ffi.wasm public/clearfile-core.wasm
          test -f public/clearfile-core.wasm || { echo "FAIL — the boot asset was not emitted into public/" >&2; exit 1; }
      - name: The import-empty guard (the no-network proof, the hygiene form)
        run: |
          node -e '
            const fs = require("fs");
            const m = new WebAssembly.Module(fs.readFileSync("public/clearfile-core.wasm"));
            const imports = WebAssembly.Module.imports(m);
            if (imports.length !== 0) {
              console.error("import guard: FAIL — the shipped module imports " + imports.length + " functions: " + imports.map(i => i.module + "." + i.name).join(", "));
              process.exit(1);
            }
            console.log("import guard: ok — the shipped .wasm has zero imports");
          '
      - run: npm run build
      - name: Bundle standalone
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          tar czf clearfile-web-standalone-${RELEASE_TAG}.tar.gz -C .next standalone
          # The D46 belt-and-suspenders: the boot asset must be IN the shipped
          # tarball — a bundle without it is exactly the GREEN-THROUGH-BROKEN
          # class the rework exists to kill (fail-closed, not fail-silent).
          tar tzf clearfile-web-standalone-${RELEASE_TAG}.tar.gz | grep -F 'standalone/public/clearfile-core.wasm' >/dev/null || {
            echo "FAIL — the boot asset is missing from the standalone bundle" >&2
            exit 1
          }
          echo "bundle guard: ok — public/clearfile-core.wasm ships in the tarball"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextjs-standalone
          path: clearfile-web-standalone-*.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Release: collect every artifact and publish a GitHub Release
  # --------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs:
      - android
      - linux
      - windows
      - macos
      - flutter-web
      - nextjs-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # only this job needs to create the release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate release tag (format + existing-tag SHA)
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || {
            echo "RELEASE_TAG '$RELEASE_TAG' is not a v-tag; refusing to publish" >&2
            exit 1
          }
          # Fail-closed refinement (Stage-2 entry gate, ENG-1): only the
          # "couldn't find remote ref" case may proceed as a fresh tag; any
          # other fetch failure refuses to build.
          # D29 fix (2026-11-26, live-verified on the v1.1 annotated-tag
          # push): on a tag-PUSH event the runner already holds the tag
          # (checkout fetched it), so re-fetching the same refspec clobbers
          # and lands in the fail-closed branch. Prefer the LOCAL tag when
          # present — it IS this run's tag. Both sides are PEELED: an
          # annotated tag's GITHUB_SHA is the tag OBJECT, not the commit.
          fetch_err="$(mktemp)"
          run_commit="$(git rev-parse "$GITHUB_SHA^{commit}" 2>/dev/null \
              || echo "$GITHUB_SHA")"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" \
              >/dev/null 2>&1; then
            tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged" != "$run_commit" ]; then
              echo "refusing: tag $RELEASE_TAG exists at $tagged" \
                   "but this run builds $run_commit ($GITHUB_SHA)" >&2
              rm -f "$fetch_err"
              exit 1
            fi
          elif git fetch --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>"$fetch_err"; then
            tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged" != "$run_commit" ]; then
              echo "refusing: tag $RELEASE_TAG exists at $tagged" \
                   "but this run builds $run_commit ($GITHUB_SHA)" >&2
              rm -f "$fetch_err"
              exit 1
            fi
          elif grep -qi "couldn't find remote ref" "$fetch_err"; then
            echo "tag $RELEASE_TAG not present remotely; treating as fresh tag"
          else
            echo "tag guard: fetch failed (not a missing-ref error); refusing to build" >&2
            cat "$fetch_err" >&2
            rm -f "$fetch_err"
            exit 1
          fi
          rm -f "$fetch_err"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
      - name: Flatten artifact tree (collision-guarded)
        run: |
          mkdir -p flat
          found=$(find release-assets -type f \( -name '*.apk' -o -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          find release-assets -type f \( -name '*.apk' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} flat/ \;
          flattened=$(ls -1 flat | wc -l)
          if [ "$found" -ne "$flattened" ]; then
            echo "artifact name collision: found $found files, flattened $flattened" >&2
            exit 1
          fi
          ls -lh flat
      - name: Copy docs
        run: |
          cp docs/reverse-engineering-protocol.md flat/
          cp docs/blueprint.pdf flat/ 2>/dev/null || true
      # D45 (ADV-LEGAL N6-exit, 2026-11-27; the fail-closed enforcement
      # landed at the Stage-2 exit close, 2026-11-28 — LEGAL's condition 1):
      # the FIRST CONVEYANCE of the wasm-served web asset owes the web
      # LICENSES manifest — the palette module (Apache-2.0), the
      # statically-linked Rust std (MIT OR Apache-2.0), and the carried MIT
      # shadcn set. Fail-closed: a release job without the manifest refuses,
      # so D45 can never be silently missed at a "too small to owe anything"
      # v1.x patch. The manifest ships as a release asset too.
      - name: D45 LICENSES manifest (fail-closed + shipped)
        run: |
          test -f LICENSES-web.md || {
            echo "D45: LICENSES-web.md is absent — the first-conveyance manifest duty is unmet; refusing to publish (DEBT D45)" >&2
            exit 1
          }
          cp LICENSES-web.md flat/
      - name: Generate SHA256SUMS
        run: |
          cd flat
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Fresh-tag dispatch: create the tag at exactly the commit this
          # workflow built (never at a racing branch tip). Unused when the
          # tag already exists — which the guard above has already checked.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ClearFile — clean-room demonstration software.

            **This is demonstration software. It is not IRS-authorized, it
            cannot e-file, and it must not be used to prepare a real tax
            return.** Nothing here is tax, legal, or professional advice.

            Binaries are **unsigned** (no code-signing certificates are held
            for this project). Verify downloads against `SHA256SUMS.txt`.

            The complete corresponding source for every binary here is the
            tagged public commit of this repository (GPL v3 s6).

            **Network disclosure (Android and macOS builds):** the optional
            AI assistant, if enabled with your own free API key, calls
            Google AI Studio / OpenRouter directly from the device, sending
            only the de-identified return figures you approved — never names,
            SSNs, or employer names. Tapping the assistant's review button
            shares the same de-identified figures for that request. All other
            data stays on the device; no telemetry exists.

            See the repository README for the engine scope, the per-engine
            limitations, and the demo disclaimer.
          files: flat/*
          fail_on_unmatched_files: true
