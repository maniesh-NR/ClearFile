          # dispatch against an existing tag that points at a DIFFERENT
          # commit would publish HEAD artifacts under an old tag's name.
          # Proceed only if the tag is absent (fresh; the release job
          # creates it at target_commitish) or points exactly at this run.
          # Fail-closed refinement (Stage-2 entry gate, ENG-1): only the
          # "couldn't find remote ref" case may proceed as a fresh tag; any
          # other fetch failure refuses to build.
          fetch_err="$(mktemp)"
          if git fetch --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>"$fetch_err"; then
            tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "refusing: tag $RELEASE_TAG exists at $tagged" \
                   "but this run builds $GITHUB_SHA" >&2
              rm -f "$fetch_err"
              exit 1
            fi
          elif grep -qi "couldn't find remote ref" "$fetch_err"; then
            echo "tag $RELEASE_TAG not present remotely; treating as fresh tag"
          else
            echo "tag guard: fetch failed (not a missing-ref error); refusing to build" >&2
            cat "$fetch_err" >&2
            rm -f "$fetch_err"
            exit 1
          fi
          rm -f "$fetch_err"
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip macOS bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent clearfile.app clearfile-macos-${RELEASE_TAG}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: clearfile/build/macos/Build/Products/Release/clearfile-macos-*.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Flutter Web (static assets)
  # --------------------------------------------------------------------------
  flutter-web:
    name: Flutter Web
    needs: flutter-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: clearfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Validate release tag (format + existing-tag SHA)
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || {
            echo "RELEASE_TAG '$RELEASE_TAG' is not a v-tag; refusing to build" >&2
            exit 1
          }
          # HEAD-artifact poisoning guard (ADV-ENG Stage-1 note 7): a
          # dispatch against an existing tag that points at a DIFFERENT
          # commit would publish HEAD artifacts under an old tag's name.
          # Proceed only if the tag is absent (fresh; the release job
          # creates it at target_commitish) or points exactly at this run.
          # Fail-closed refinement (Stage-2 entry gate, ENG-1): only the
          # "couldn't find remote ref" case may proceed as a fresh tag; any
          # other fetch failure refuses to build.
          fetch_err="$(mktemp)"
          if git fetch --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>"$fetch_err"; then
            tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "refusing: tag $RELEASE_TAG exists at $tagged" \
                   "but this run builds $GITHUB_SHA" >&2
              rm -f "$fetch_err"
              exit 1
            fi
          elif grep -qi "couldn't find remote ref" "$fetch_err"; then
            echo "tag $RELEASE_TAG not present remotely; treating as fresh tag"
          else
            echo "tag guard: fetch failed (not a missing-ref error); refusing to build" >&2
            cat "$fetch_err" >&2
            rm -f "$fetch_err"
            exit 1
          fi
          rm -f "$fetch_err"
      - run: flutter pub get
      - run: flutter build web --release
      - name: Bundle
        run: tar czf ../clearfile-flutter-web-${RELEASE_TAG}.tar.gz -C build web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-web
          path: clearfile-flutter-web-*.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Next.js Web standalone
  # --------------------------------------------------------------------------
  nextjs-web:
    name: Next.js standalone web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Validate release tag (format + existing-tag SHA)
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || {
            echo "RELEASE_TAG '$RELEASE_TAG' is not a v-tag; refusing to build" >&2
            exit 1
          }
          # HEAD-artifact poisoning guard (ADV-ENG Stage-1 note 7): a
          # dispatch against an existing tag that points at a DIFFERENT
          # commit would publish HEAD artifacts under an old tag's name.
          # Proceed only if the tag is absent (fresh; the release job
          # creates it at target_commitish) or points exactly at this run.
          # Fail-closed refinement (Stage-2 entry gate, ENG-1): only the
          # "couldn't find remote ref" case may proceed as a fresh tag; any
          # other fetch failure refuses to build.
          fetch_err="$(mktemp)"
          if git fetch --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>"$fetch_err"; then
            tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "refusing: tag $RELEASE_TAG exists at $tagged" \
                   "but this run builds $GITHUB_SHA" >&2
              rm -f "$fetch_err"
              exit 1
            fi
          elif grep -qi "couldn't find remote ref" "$fetch_err"; then
            echo "tag $RELEASE_TAG not present remotely; treating as fresh tag"
          else
            echo "tag guard: fetch failed (not a missing-ref error); refusing to build" >&2
            cat "$fetch_err" >&2
            rm -f "$fetch_err"
            exit 1
          fi
          rm -f "$fetch_err"
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm run build
      - name: Bundle standalone
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          tar czf clearfile-web-standalone-${RELEASE_TAG}.tar.gz -C .next standalone
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextjs-standalone
          path: clearfile-web-standalone-*.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Release: collect every artifact and publish a GitHub Release
  # --------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs:
      - android
      - linux
      - windows
      - macos
      - flutter-web
      - nextjs-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # only this job needs to create the release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate release tag (format + existing-tag SHA)
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || {
            echo "RELEASE_TAG '$RELEASE_TAG' is not a v-tag; refusing to publish" >&2
            exit 1
          }
          # Fail-closed refinement (Stage-2 entry gate, ENG-1): only the
          # "couldn't find remote ref" case may proceed as a fresh tag; any
          # other fetch failure refuses to build.
          fetch_err="$(mktemp)"
          if git fetch --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>"$fetch_err"; then
            tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "refusing: tag $RELEASE_TAG exists at $tagged" \
                   "but this run builds $GITHUB_SHA" >&2
              rm -f "$fetch_err"
              exit 1
            fi
          elif grep -qi "couldn't find remote ref" "$fetch_err"; then
            echo "tag $RELEASE_TAG not present remotely; treating as fresh tag"
          else
            echo "tag guard: fetch failed (not a missing-ref error); refusing to build" >&2
            cat "$fetch_err" >&2
            rm -f "$fetch_err"
            exit 1
          fi
          rm -f "$fetch_err"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
      - name: Flatten artifact tree (collision-guarded)
        run: |
          mkdir -p flat
          found=$(find release-assets -type f \( -name '*.apk' -o -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          find release-assets -type f \( -name '*.apk' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} flat/ \;
          flattened=$(ls -1 flat | wc -l)
          if [ "$found" -ne "$flattened" ]; then
            echo "artifact name collision: found $found files, flattened $flattened" >&2
            exit 1
          fi
          ls -lh flat
      - name: Copy docs
        run: |
          cp docs/reverse-engineering-protocol.md flat/
          cp docs/blueprint.pdf flat/ 2>/dev/null || true
      - name: Generate SHA256SUMS
        run: |
          cd flat
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Fresh-tag dispatch: create the tag at exactly the commit this
          # workflow built (never at a racing branch tip). Unused when the
          # tag already exists — which the guard above has already checked.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ClearFile — clean-room demonstration software.

            **This is demonstration software. It is not IRS-authorized, it
            cannot e-file, and it must not be used to prepare a real tax
            return.** Nothing here is tax, legal, or professional advice.

            Binaries are **unsigned** (no code-signing certificates are held
            for this project). Verify downloads against `SHA256SUMS.txt`.

            The complete corresponding source for every binary here is the
            tagged public commit of this repository (GPL v3 s6).

            **Network disclosure (Android and macOS builds):** the optional
            AI assistant, if enabled with your own free API key, calls
            Google AI Studio / OpenRouter directly from the device, sending
            only the de-identified return figures you approved — never names,
            SSNs, or employer names. Tapping the assistant's review button
            shares the same de-identified figures for that request. All other
            data stays on the device; no telemetry exists.

            See the repository README for the engine scope, the per-engine
            limitations, and the demo disclaimer.
          files: flat/*
          fail_on_unmatched_files: true
