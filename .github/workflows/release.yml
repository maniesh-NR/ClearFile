name: Build and release all platforms

# Triggered by pushing a tag like v1.0.0 (or a manual dispatch with a tag
# input). Builds the Flutter app for every target platform (Android
# armv7/armv8a/x86_64, Linux x64, Windows x64, macOS universal, Web) plus
# the Next.js standalone web bundle, zips each one, attaches them with a
# SHA256SUMS manifest and a demo-disclaimer body to a GitHub Release for
# that tag, and uploads the blueprint PDF and RE protocol doc as additional
# assets.
#
# Stage-0 gate hardening (2026-11-14; ADV-SEC #3/#4/#5/#6, ADV-ENG #4/#5):
# - least privilege: contents:read everywhere, contents:write only on the
#   release job
# - RELEASE_TAG validated against ^v… so workflow_dispatch can no longer
#   produce branch-named assets or a tagless release step
# - no raw ${{ }} interpolation into pwsh (env-var form everywhere)
# - timeout-minutes and a concurrency group on every job
# - npm ci with the committed package-lock.json; tsc --noEmit typecheck
# - SHA256SUMS generated into the release; collision guard in the flatten
#
# Stage-1 hardening (2026-11-14; ADV-SEC #7/D10, ADV-ENG note 7):
# - every `uses:` pinned to a full commit SHA (readable tag in the comment)
# - existing-tag SHA guard: a dispatch against a tag that points at a
#   different commit is refused instead of publishing HEAD artifacts under
#   an old tag's name; a fresh tag is created at exactly this run's SHA
#   (target_commitish), never at a racing branch tip
# - android APKs are collected under clearfile/build/ (gitignored), not
#   the tracked clearfile/assets/ tree (D7)
#
# Stage-2 entry-gate fixes (2026-11-14; ADV-ENG ENG-1, SEC-1/LEGAL-1):
# - the tag guard is fail-closed on unexpected fetch errors: only the
#   "couldn't find remote ref" case may proceed as a fresh tag
# - the release body carries the GPL §6 corresponding-source statement
#   (same wording as the live-patched v1.0.0 description)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (must match ^v[0-9]…)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Group by the tag alone (ADV-SEC/ADV-ENG Stage-1 notes): a tag push and a
  # dispatch for the same tag must share one queue, not race the release job.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Flutter: shared setup and tests
  # --------------------------------------------------------------------------
  flutter-test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clearfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # --------------------------------------------------------------------------
  # Android: three APKs split by ABI
  # --------------------------------------------------------------------------
  android:
    name: Android APK (split per ABI)
    needs: flutter-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: clearfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Validate release tag (format + existing-tag SHA)
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || {
            echo "RELEASE_TAG '$RELEASE_TAG' is not a v-tag; refusing to build" >&2
            exit 1
          }
          # HEAD-artifact poisoning guard (ADV-ENG Stage-1 note 7): a
          # dispatch against an existing tag that points at a DIFFERENT
          # commit would publish HEAD artifacts under an old tag's name.
          # Proceed only if the tag is absent (fresh; the release job
          # creates it at target_commitish) or points exactly at this run.
          # Fail-closed refinement (Stage-2 entry gate, ENG-1): only the
          # "couldn't find remote ref" case may proceed as a fresh tag; any
          # other fetch failure refuses to build.
          fetch_err="$(mktemp)"
          if git fetch --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>"$fetch_err"; then
            tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "refusing: tag $RELEASE_TAG exists at $tagged" \
                   "but this run builds $GITHUB_SHA" >&2
              rm -f "$fetch_err"
              exit 1
            fi
          elif grep -qi "couldn't find remote ref" "$fetch_err"; then
            echo "tag $RELEASE_TAG not present remotely; treating as fresh tag"
          else
            echo "tag guard: fetch failed (not a missing-ref error); refusing to build" >&2
            cat "$fetch_err" >&2
            rm -f "$fetch_err"
            exit 1
          fi
          rm -f "$fetch_err"
      - run: flutter pub get
      - name: Build split APKs
        run: flutter build apk --split-per-abi --release
      - name: Rename and collect APKs
        run: |
          # Collected under the gitignored build/ tree: the release job used
          # to write into the tracked clearfile/assets/ directory (D7), which
          # is exactly where an accidental commit of release outputs would
          # start.
          mkdir -p build/release-apks
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/release-apks/clearfile-android-armv7-${RELEASE_TAG}.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   build/release-apks/clearfile-android-armv8a-${RELEASE_TAG}.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      build/release-apks/clearfile-android-x86_64-${RELEASE_TAG}.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apks
          path: clearfile/build/release-apks/*.apk
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Linux x64
  # --------------------------------------------------------------------------
  linux:
    name: Linux x64
    needs: flutter-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: clearfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Validate release tag (format + existing-tag SHA)
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || {
            echo "RELEASE_TAG '$RELEASE_TAG' is not a v-tag; refusing to build" >&2
            exit 1
          }
          # HEAD-artifact poisoning guard (ADV-ENG Stage-1 note 7): a
          # dispatch against an existing tag that points at a DIFFERENT
          # commit would publish HEAD artifacts under an old tag's name.
          # Proceed only if the tag is absent (fresh; the release job
          # creates it at target_commitish) or points exactly at this run.
          # Fail-closed refinement (Stage-2 entry gate, ENG-1): only the
          # "couldn't find remote ref" case may proceed as a fresh tag; any
          # other fetch failure refuses to build.
          fetch_err="$(mktemp)"
          if git fetch --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>"$fetch_err"; then
            tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "refusing: tag $RELEASE_TAG exists at $tagged" \
                   "but this run builds $GITHUB_SHA" >&2
              rm -f "$fetch_err"
              exit 1
            fi
          elif grep -qi "couldn't find remote ref" "$fetch_err"; then
            echo "tag $RELEASE_TAG not present remotely; treating as fresh tag"
          else
            echo "tag guard: fetch failed (not a missing-ref error); refusing to build" >&2
            cat "$fetch_err" >&2
            rm -f "$fetch_err"
            exit 1
          fi
          rm -f "$fetch_err"
      - name: Install Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev clang cmake libstdc++-12-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Bundle
        run: |
          cd build/linux/x64/release
          tar czf $GITHUB_WORKSPACE/clearfile-linux-x64-${RELEASE_TAG}.tar.gz bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64
          path: clearfile-linux-x64-*.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows x64
  # --------------------------------------------------------------------------
  windows:
    name: Windows x64
    needs: flutter-test
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: clearfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Validate release tag (format + existing-tag SHA)
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || {
            echo "RELEASE_TAG '$RELEASE_TAG' is not a v-tag; refusing to build" >&2
            exit 1
          }
          # Fail-closed refinement (Stage-2 entry gate, ENG-1): only the
          # "couldn't find remote ref" case may proceed as a fresh tag; any
          # other fetch failure refuses to build.
          fetch_err="$(mktemp)"
          if git fetch --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>"$fetch_err"; then
            tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "refusing: tag $RELEASE_TAG exists at $tagged" \
                   "but this run builds $GITHUB_SHA" >&2
              rm -f "$fetch_err"
              exit 1
            fi
          elif grep -qi "couldn't find remote ref" "$fetch_err"; then
            echo "tag $RELEASE_TAG not present remotely; treating as fresh tag"
          else
            echo "tag guard: fetch failed (not a missing-ref error); refusing to build" >&2
            cat "$fetch_err" >&2
            rm -f "$fetch_err"
            exit 1
          fi
          rm -f "$fetch_err"
      - run: flutter pub get
      - run: flutter build windows --release
      # Env-var access, not ${{ github.ref_name }} interpolation: ref names
      # may legally contain shell-significant characters (ADV-SEC #5).
      - name: Zip Windows bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "clearfile-windows-x64-$($env:RELEASE_TAG).zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: clearfile/clearfile-windows-x64-*.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS universal
  # --------------------------------------------------------------------------
  macos:
    name: macOS universal
    needs: flutter-test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: clearfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Validate release tag (format + existing-tag SHA)
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || {
            echo "RELEASE_TAG '$RELEASE_TAG' is not a v-tag; refusing to build" >&2
            exit 1
          }
