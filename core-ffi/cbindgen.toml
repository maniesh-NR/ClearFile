# SPDX-License-Identifier: GPL-3.0-only
# cbindgen's config for clearfile-core-ffi (N3, ADR-017's FFI seam: ONE
# flat C ABI, cbindgen-generated header). The regenerated header is a
# COMMITTED tracked artifact (the N4 Win32 C++ / N5 macOS SPM contract),
# deterministically reproduced by this config under the exact-pinned
# cbindgen =0.29.4 (Cargo.toml's build-dependency); the CI freshness
# check regenerates to a temp file and diffs against the tracked header.
#
# LEGAL-3 (the N3 gate): the SPDX line is EMITTED BY THIS CONFIG (the
# `header` below) so every regeneration carries it — never hand-added
# (a hand-add dies on the next regeneration). cbindgen's own "do not
# edit" banner (after_includes below) is the generation provenance; the
# two coexist as separate comments (banner = provenance, SPDX = our
# licensing). The header is OUR expression — a mechanical transform of
# our own API declarations; MPL-2.0 attaches to cbindgen's source, not
# to its output.

language = "C"

# Every regenerated header starts with our license line.
header = """/*
 * SPDX-License-Identifier: GPL-3.0-only
 * The ClearFile flat C ABI over clearfile-core — generated by cbindgen
 * (=0.29.4, MPL-2.0, build-time-only) from core-ffi's own declarations.
 */"""

# The extern "C" guards for C++ consumers (the N4 gate's probe-verified
# finding: a bare C++17 include of an unguarded header COMPILES clean but
# LINK-FAILS on the mangled references — the silent trap; the probe
# verified the guarded form stays valid C99, so the N5 SPM / N6 consumers
# are unaffected). Emitted by the config, never hand-edited (a hand-add
# dies on the next regeneration — the LEGAL-3 precedent).
after_includes = """// This file is autogenerated by cbindgen (=0.29.4). Do not edit.
#ifdef __cplusplus
extern \"C\" {
#endif"""
# The matching close of the guard.
trailer = """#ifdef __cplusplus
} // extern "C"
#endif"""

# The flat C ABI is C99 (`stdbool.h` for the bool parameters), NOT the
# cbindgen default C++ dialect (<cstdint>/extern-C++ style) — the ENG-8
# finding: pin Language::C explicitly. N4 (Win32 C++) and N5 (SPM) consume
# this C99 dialect as-is. The system includes are auto-detected by
# cbindgen (one <stdarg.h>/<stdbool.h>/<stdint.h>/<stdlib.h> line each —
# no sys_includes override, no duplicates).
style = "type"

# The JNI shim (src/jni.rs) is NOT part of the flat C ABI — it is the
# thin Android/JVM marshaling layer over these same functions (its
# Java_* exports ride in the same .so but are never in the header; the
# JVM side binds them by name). The shim's declarations carry
# `/// cbindgen:ignore` (the documented per-declaration exclusion —
# ENG-3's probe caught cfg-gated Java_* fns being emitted otherwise),
# verified by the CI freshness check + `grep -c Java_ clearfile.h` == 0.
