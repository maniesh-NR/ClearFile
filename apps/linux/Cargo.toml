# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "clearfile-linux"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "ClearFile Linux native UI (N2, the ADR-017 epilogue: Slint over the clearfile-core Rust core)"
publish = false

# The N2 gate's audited-tree-is-the-built-tree condition (SEC-3): slint
# is bound to the audited 1.19 series; default features OFF — the
# skia-safe CDN prebuilts are EXCLUDED (the renderer set is femtovg +
# software, per the gate's ENG-3); every CI invocation is --locked with
# the committed Cargo.lock.
[dependencies]
clearfile-core = { path = "../../core" }
slint = { version = "1.19", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-femtovg",
  "renderer-software",
  "compat-1-2",
  "accessibility",
] }

# N2 session 2 (reported): the ONE added dependency of the session —
# slint-build, the build-time compiler of ui/app.slint (the standard Slint
# split: markup in .slint, compiled by build.rs, consumed via
# slint::include_modules!). Bound to the same audited 1.19 series, the
# renderer-software feature mirroring the runtime's renderer set; the
# [dependencies] lines above are byte-unchanged, and Cargo.lock was
# regenerated for this addition (the added packages are the slint compiler
# tree, audited by the same cargo-deny lane).
[build-dependencies]
slint-build = { version = "1.19", default-features = false, features = [
  "renderer-software",
  # slint-build 1.19 fails closed without the forward-compatibility
  # feature (its build.rs errors: "The feature `compat-1-18` must be
  # enabled to ensure forward compatibility") — enabled explicitly.
  "compat-1-18",
] }
